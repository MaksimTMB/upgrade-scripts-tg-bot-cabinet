name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          shellcheck -S warning update-bot.sh update-cabinet.sh

  release:
    needs: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build archives
        run: |
          mkdir -p dist
          TAG="${GITHUB_REF_NAME}"
          tar -czf "dist/upgrade-scripts-${TAG}.tar.gz" \
              update-bot.sh update-cabinet.sh README.md CHANGELOG.md
          (cd dist && sha256sum "upgrade-scripts-${TAG}.tar.gz" \
              > "upgrade-scripts-${TAG}.tar.gz.sha256")

      - name: Extract changelog section
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # Pull the section between "## [X.Y.Z]" and the next "## ["
          NOTES=$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { p=1; next }
            p && /^## \[/ { exit }
            p { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](CHANGELOG.md)."
          fi
          {
            echo "notes<<__EOF__"
            echo "$NOTES"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            dist/upgrade-scripts-${{ github.ref_name }}.tar.gz
            dist/upgrade-scripts-${{ github.ref_name }}.tar.gz.sha256
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
